name: Build Install Images

on:
  workflow_call:
    inputs:
      release_ref:
        description: "Exact Release Please SHA to build"
        required: true
        type: string
      release_tag:
        description: "Exact Release Please tag to validate"
        required: true
        type: string
  pull_request:
    paths:
      - "build/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-images.yml"
  push:
    branches:
      - main
    paths:
      - "build/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      persist_fs:
        description: "Default persistence filesystem"
        required: true
        default: "vfat"
        type: choice
        options:
          - ext4
          - fat32
          - vfat
      menu_backend:
        description: "Default menu backend"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - whiptail
          - dialog
          - text
      clean_build:
        description: "Clean kernel/ZFS rebuild (full mode only)"
        required: true
        default: false
        type: boolean
      force:
        description: "Overwrite existing output files"
        required: true
        default: true
        type: boolean
      publish:
        description: "Publish built outputs to PUBLISH_DIR"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-images:
    name: Build install images
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'update/unraid-os-') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: install-images-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    env:
      ARTIFACT_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      PUBLISH_DIR: ${{ github.workspace }}/artifacts/published
    steps:
      - name: Checkout repository
        # actions/checkout v4, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/actions/checkout.git refs/tags/v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 1

      - name: Show workflow ref and script version
        shell: bash
        run: |
          set -euo pipefail
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "event_name=${{ github.event_name }}"
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          echo "---- scripts/build-install-images.sh (first 40 lines) ----"
          sed -n '1,40p' ./scripts/build-install-images.sh

      - name: Validate Release Please version metadata
        if: ${{ inputs.release_ref != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#Installer-}"
          manifest_version="$(jq -er '.["."]' .release-please-manifest.json)"
          version_file="$(tr -d '[:space:]' < installer-version.txt)"
          os_version="$(jq -er '.version' build/unraid-release-lock.json)"
          os_pattern="${os_version//./\\.}"
          if [[ "$release_version" == "$os_version" || \
                "$release_version" =~ ^${os_pattern}-sp\.[1-9][0-9]*$ ]]; then
            os_release_matches=true
          else
            os_release_matches=false
          fi

          if [[ "$RELEASE_TAG" != "Installer-${release_version}" || \
                "$manifest_version" != "$release_version" || \
                "$version_file" != "$release_version" || \
                "$os_release_matches" != "true" ]]; then
            echo "Release version metadata is inconsistent:" >&2
            echo "  tag=$RELEASE_TAG" >&2
            echo "  manifest=$manifest_version" >&2
            echo "  version_file=$version_file" >&2
            echo "  bundled_os=$os_version" >&2
            exit 1
          fi

      - name: Restore kernel and OpenZFS build cache
        id: restore-build-cache
        # actions/cache v4, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/actions/cache.git refs/tags/v4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: zfs-live-build
          key: install-build-v5-${{ runner.os }}-${{ hashFiles('build/version-lock.json', 'scripts/config', 'scripts/build-kernel-zfs-cache.sh') }}

      - name: Sanitize restored build cache
        shell: bash
        run: |
          set -euo pipefail

          echo "cache-hit=${{ steps.restore-build-cache.outputs.cache-hit }}"

          if [[ ! -d zfs-live-build ]]; then
            echo "No zfs-live-build directory restored."
            exit 0
          fi

          echo "Restored kernel/zfs stamp files:"
          find zfs-live-build -maxdepth 1 -type f -name '.*-build-*.stamp' -print | sort || true

          echo "Removing any restored final release artifacts before this run builds fresh outputs."
          find zfs-live-build -maxdepth 1 -type f \( -name 'install-*.iso' -o -name 'install-*.img' \) -print -delete

          if [[ -d zfs-live-build/rootfs ]]; then
            echo "Removing restored rootfs; release builds should regenerate runtime filesystem content."
            sudo rm -rf zfs-live-build/rootfs
          fi

      - name: Release artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "Build Install Images may restore kernel/OpenZFS build artifacts from GitHub Actions cache."
          echo "Restored final ISO/IMG files and rootfs content are removed before building release outputs."
          echo "Artifacts uploaded by this workflow are generated by the checked-out source in this run."
          echo "Use prime-build-cache.yml to refresh the kernel/OpenZFS cache."

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/install-deps.sh
          sudo ./scripts/install-deps.sh

      - name: Prepare workspace seed and publish paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/published
          # Empty directories are not tracked by git, so create defaults if absent.
          mkdir -p ./persistent ./persistent/zips ./persistent/logs

      - name: Preflight required user build files
        shell: bash
        run: |
          set -euo pipefail

          required_scripts=(
            ./scripts/build-install-images.sh
            ./scripts/build-kernel-zfs-cache.sh
            ./scripts/build-iso.sh
            ./scripts/build-usb-native.sh
            ./scripts/menu_gui_user.sh
            ./scripts/create_internal_boot_user.sh
          )

          for script in "${required_scripts[@]}"; do
            [[ -f "$script" ]] || { echo "Missing required file: $script" >&2; exit 1; }
            [[ -x "$script" ]] || chmod +x "$script"
          done

      - name: Build images
        shell: bash
        env:
          CLEAN_BUILD: ${{ inputs.clean_build || false }}
          FORCE_BUILD: ${{ github.event_name != 'workflow_dispatch' || inputs.force }}
          MENU_BACKEND: ${{ inputs.menu_backend || 'auto' }}
          PERSIST_FS: ${{ inputs.persist_fs || 'vfat' }}
          PUBLISH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && '1' || '0' }}
          SEED_DIR: ${{ github.workspace }}/persistent
          VERSION_LOCK_FILE: ${{ github.workspace }}/build/version-lock.json
        run: |
          set -euo pipefail

          args=(--mode "full" --persist-fs "$PERSIST_FS" --menu-backend "$MENU_BACKEND")

          if [[ "$CLEAN_BUILD" == "true" ]]; then
            args+=(--clean-build)
          fi

          if [[ "$FORCE_BUILD" == "true" ]]; then
            args+=(--force)
          fi

          ./scripts/build-install-images.sh "${args[@]}"

      - name: Validate user ISO and IMG outputs
        shell: bash
        run: |
          set -euo pipefail

          required_outputs=(
            zfs-live-build/install-user.iso
            zfs-live-build/install-user.img
          )

          for output in "${required_outputs[@]}"; do
            [[ -f "$output" ]] || { echo "Missing required user artifact: $output" >&2; exit 1; }
          done

      - name: Collect build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ -d zfs-live-build ]]; then
            find zfs-live-build -maxdepth 1 -type f \( -name "install-*.iso" -o -name "install-*.img" \) -exec cp -v {} artifacts/ \;
          fi

      - name: Smoke check artifacts and generate checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          artifacts_to_check=(artifacts/install-*.iso artifacts/install-*.img)
          [[ ${#artifacts_to_check[@]} -gt 0 ]] || {
            echo "No install artifacts found for smoke checks" >&2
            exit 1
          }

          : > artifacts/checksums.sha256

          for artifact in "${artifacts_to_check[@]}"; do
            [[ -s "$artifact" ]] || { echo "Artifact is empty: $artifact" >&2; exit 1; }

            mime_type="$(file --brief --mime-type "$artifact")"
            case "$artifact" in
              *.iso)
                [[ "$mime_type" == "application/x-iso9660-image" || "$mime_type" == "application/octet-stream" ]] || {
                  echo "Unexpected ISO mime type for $artifact: $mime_type" >&2
                  exit 1
                }
                min_size_bytes=67108864
                ;;
              *-minimal.img)
                [[ "$mime_type" == "application/octet-stream" || "$mime_type" == "application/x-iso9660-image" ]] || {
                  echo "Unexpected IMG mime type for $artifact: $mime_type" >&2
                  exit 1
                }
                min_size_bytes=33554432
                ;;
              *.img)
                [[ "$mime_type" == "application/octet-stream" || "$mime_type" == "application/x-iso9660-image" ]] || {
                  echo "Unexpected IMG mime type for $artifact: $mime_type" >&2
                  exit 1
                }
                min_size_bytes=67108864
                ;;
            esac

            size_bytes="$(stat -c%s "$artifact")"
            (( size_bytes >= min_size_bytes )) || {
              echo "Artifact too small: $artifact (${size_bytes} bytes, expected >= ${min_size_bytes})" >&2
              exit 1
            }

            sha256sum "$artifact" >> artifacts/checksums.sha256
          done

      - name: Validate reusable build cache
        if: ${{ success() && steps.restore-build-cache.outputs.cache-hit != 'true' }}
        id: cache-complete
        shell: bash
        run: |
          set -euo pipefail

          kernel_stamp_count="$(find zfs-live-build -maxdepth 1 -type f -name '.*kernel-build-*.stamp' | wc -l | tr -d '[:space:]')"
          zfs_stamp_count="$(find zfs-live-build -maxdepth 1 -type f -name '.*zfs-build-*.stamp' | wc -l | tr -d '[:space:]')"

          echo "kernel_stamp_count=$kernel_stamp_count"
          echo "zfs_stamp_count=$zfs_stamp_count"

          if [[ "$kernel_stamp_count" != "0" && "$zfs_stamp_count" != "0" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping cache save because kernel or OpenZFS build stamps are missing."
          fi

      - name: Prune generated images and rootfs from build cache
        if: ${{ success() && steps.cache-complete.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          find zfs-live-build -maxdepth 1 -type f \( -name 'install-*.iso' -o -name 'install-*.img' \) -delete
          if [[ -d zfs-live-build/rootfs ]]; then
            sudo rm -rf zfs-live-build/rootfs
          fi

      - name: Save reusable kernel and OpenZFS build cache
        if: ${{ success() && steps.cache-complete.outputs.ready == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: zfs-live-build
          key: install-build-v5-${{ runner.os }}-${{ hashFiles('build/version-lock.json', 'scripts/config', 'scripts/build-kernel-zfs-cache.sh') }}

      - name: Commit published outputs to repository
        if: ${{ success() && inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "artifacts/published/*" > /dev/null; then
            echo "No files found under artifacts/published; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artifacts/published

          if git diff --cached --quiet; then
            echo "No published output changes to commit."
            exit 0
          fi

          git commit -m "ci: publish install-user outputs (run ${{ github.run_number }})"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload user ISO
        if: ${{ always() }}
        # actions/upload-artifact v4, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/actions/upload-artifact.git refs/tags/v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-user-iso-${{ github.run_number }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: artifacts/install-user.iso
          if-no-files-found: warn

      - name: Upload user IMG
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-user-img-${{ github.run_number }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: artifacts/install-user.img
          if-no-files-found: warn

      - name: Upload user minimal IMG
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-user-minimal-img-${{ github.run_number }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: artifacts/install-user-minimal.img
          if-no-files-found: warn

      - name: Upload user checksums
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-user-checksums-${{ github.run_number }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: artifacts/checksums.sha256
          if-no-files-found: warn

      - name: Upload Linux Rescue launcher
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-user-linux-rescue-launcher-${{ github.run_number }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: scripts/linux-rescue-vm.sh
          if-no-files-found: error

      - name: Upload user published outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-user-published-${{ github.run_number }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: artifacts/published/*
          if-no-files-found: warn

  linux-rescue-kvm-e2e:
    name: Linux Rescue KVM E2E
    needs: build-images
    if: ${{ needs.build-images.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 1

      - name: Download installer ISO
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: install-user-iso-${{ github.run_number }}
          path: artifacts/e2e

      - name: Install KVM test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            dosfstools \
            gdisk \
            jq \
            mtools \
            netcat-openbsd \
            ovmf \
            parted \
            qemu-system-x86 \
            qemu-utils \
            xorriso \
            zfsutils-linux

      - name: Require hardware virtualization
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "The GitHub-hosted runner does not expose /dev/kvm." >&2
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          qemu-system-x86_64 --version

      - name: Download pinned Unraid OS payload
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -er '.url' build/unraid-release-lock.json)"
          filename="$(jq -er '.filename' build/unraid-release-lock.json)"
          expected_sha256="$(jq -er '.sha256' build/unraid-release-lock.json)"
          destination="artifacts/e2e/$filename"
          curl --fail --location --retry 3 --connect-timeout 15 \
            --output "$destination" "$url"
          printf '%s  %s\n' "$expected_sha256" "$destination" | sha256sum --check --strict

      - name: Install and verify on disposable KVM disks
        shell: bash
        run: |
          set -euo pipefail
          iso="$(find artifacts/e2e -maxdepth 1 -type f -name 'install-user.iso' -print -quit)"
          unraid_zip="$(find artifacts/e2e -maxdepth 1 -type f -name 'unRAIDServer-*-x86_64.zip' -print -quit)"
          [[ -n "$iso" && -n "$unraid_zip" ]]
          sudo tests/linux-rescue-kvm-e2e.sh ci \
            --iso "$iso" \
            --unraid-zip "$unraid_zip" \
            --state-dir "$RUNNER_TEMP/unraid-installer-e2e" \
            --ram 4096 \
            --cpus 2

      - name: Upload KVM E2E evidence
        if: ${{ always() }}
        shell: bash
        run: |
          sudo chmod a+rx "$RUNNER_TEMP/unraid-installer-e2e" 2>/dev/null || true
          sudo find "$RUNNER_TEMP/unraid-installer-e2e" -maxdepth 1 -type f \
            -exec chmod a+r {} + 2>/dev/null || true

      - name: Archive KVM E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-rescue-kvm-e2e-${{ github.run_number }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/unraid-installer-e2e/serial.log
            ${{ runner.temp }}/unraid-installer-e2e/disk-identities.tsv
            ${{ runner.temp }}/unraid-installer-e2e/installer-command.txt
          if-no-files-found: warn
