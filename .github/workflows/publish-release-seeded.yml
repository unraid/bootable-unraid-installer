name: Publish Seeded Install Release

on:
  workflow_call:
    inputs:
      source_run_id:
        description: "Run database ID containing exact-release build artifacts"
        required: true
        type: string
      release_tag:
        description: "Existing Release Please tag"
        required: true
        type: string
      release_sha:
        description: "Exact Release Please source SHA"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Build Install Images run database ID"
        required: true
        type: string
      release_tag:
        description: "Existing Release Please tag (example: Installer-7.4.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish seeded release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and verify release provenance
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^Installer-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use Installer-<SemVer>: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq='.object.sha')"
          if [[ -n "$EXPECTED_RELEASE_SHA" && "$tag_sha" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Release tag points to $tag_sha, expected $EXPECTED_RELEASE_SHA" >&2
            exit 1
          fi

          source_sha="$(gh run view "$SOURCE_RUN_ID" --json headSha --jq='.headSha')"
          if [[ "$source_sha" != "$tag_sha" ]]; then
            echo "Source run built $source_sha, but $RELEASE_TAG points to $tag_sha" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            conclusion="$(gh run view "$SOURCE_RUN_ID" --json conclusion --jq='.conclusion')"
            [[ "$conclusion" == "success" ]] || {
              echo "Manual publication requires a successful source run: $conclusion" >&2
              exit 1
            }
          fi

          echo "release_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_TAG#Installer-}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact released source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git describe --tags --exact-match "$RELEASE_SHA")" = "$RELEASE_TAG"

      - name: Download exact-release bundled image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-img-*
          merge-multiple: true
          path: release-assets

      - name: Prepare bundled image and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          [[ -s release-assets/install-user.img ]] || {
            echo "Missing required file: release-assets/install-user.img" >&2
            exit 1
          }

          asset="release-assets/unraid-installer-${RELEASE_VERSION}-bundled.img.zip"
          zip -9 -j "$asset" release-assets/install-user.img
          rm -f release-assets/install-user.img
          md5sum "$asset" | awk '{print $1}' > "${asset}.md5"
          sha256sum "$asset" | awk '{print $1}' > "${asset}.sha256"

      - name: Attach assets to the existing Release Please release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            release-assets/unraid-installer-*-bundled.img.zip \
            release-assets/unraid-installer-*-bundled.img.zip.md5 \
            release-assets/unraid-installer-*-bundled.img.zip.sha256 \
            --clobber

      - name: Verify anonymous release downloads
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          downloaded="$(mktemp -d)"
          trap 'rm -rf "$downloaded"' EXIT
          for asset in release-assets/*; do
            filename="${asset##*/}"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --output "$downloaded/$filename" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$filename"
            cmp "$asset" "$downloaded/$filename"
          done
