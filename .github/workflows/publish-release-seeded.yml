name: Publish Seeded Install Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID from Build Install Images (default: latest)"
        required: false
        default: "latest"
        type: string
      release_tag:
        description: "Release tag to create/update (example: install-user-seeded-v2026.04.27)"
        required: true
        type: string
      release_name:
        description: "Release name (defaults to tag if empty)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create as draft release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish seeded release assets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # actions/checkout v4, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/actions/checkout.git refs/tags/v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: List recent Build Install Images runs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Recent completed Build Install Images runs ==="
          echo ""
          gh run list \
            --workflow=build-images.yml \
            --status=completed \
            --limit=10 \
            --json=number,createdAt,status,conclusion \
            --template='{{range .}}{{.number}} | {{.createdAt}} | {{.status}} | {{.conclusion}}{{"\n"}}{{end}}'
          echo ""
          echo "Optionally override by setting source_run_id to a specific run number."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve source run ID
        id: run-id
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="${{ inputs.source_run_id }}"

          if [[ "$source_run_id" == "latest" ]]; then
            db_id=$(gh run list \
              --workflow=build-images.yml \
              --status=completed \
              --limit=1 \
              --json=databaseId,number \
              --jq='.[0].databaseId')
            run_num=$(gh run list \
              --workflow=build-images.yml \
              --status=completed \
              --limit=1 \
              --json=databaseId,number \
              --jq='.[0].number')
            echo "Resolved 'latest' to run number $run_num (database ID: $db_id)"
            source_run_id="$db_id"
          else
            db_id=$(gh run list \
              --workflow=build-images.yml \
              --limit=50 \
              --json=databaseId,number \
              --jq="map(select(.number == ($source_run_id | tonumber))) | .[0].databaseId")
            [[ -n "$db_id" && "$db_id" != "null" ]] || {
              echo "Could not resolve run number $source_run_id to a database ID" >&2
              exit 1
            }
            echo "Resolved run number $source_run_id to database ID: $db_id"
            source_run_id="$db_id"
          fi

          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag }}"
          release_name="${{ inputs.release_name }}"

          if [[ -z "$release_name" ]]; then
            release_name="$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Download IMG artifact from source run
        # actions/download-artifact v4, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/actions/download-artifact.git refs/tags/v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-img-*
          merge-multiple: true
          path: release-assets

      - name: Validate downloaded release assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            release-assets/install-user.img
          )

          for file in "${required_files[@]}"; do
            [[ -s "$file" ]] || { echo "Missing required file: $file" >&2; exit 1; }
          done

          echo "Release assets ready:"
          ls -lh release-assets

      - name: Compress seeded IMG for release
        shell: bash
        run: |
          set -euo pipefail
          echo "Compressing install-user.img..."
          zip -9 -j release-assets/install-user.img.zip release-assets/install-user.img
          echo "Compressed sizes:"
          ls -lh release-assets/install-user.img.zip

      - name: Generate per-file MD5 checksums
        shell: bash
        run: |
          set -euo pipefail
          md5sum release-assets/install-user.img.zip | awk '{print $1}' > release-assets/install-user.img.zip.md5
          ls -lh release-assets/*.md5

      - name: Create or update GitHub release
        # softprops/action-gh-release v2, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/softprops/action-gh-release.git refs/tags/v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: true
          files: |
            release-assets/install-user.img.zip
            release-assets/install-user.img.zip.md5
          generate_release_notes: true
