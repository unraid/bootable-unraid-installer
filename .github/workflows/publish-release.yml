name: Publish Install Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID from Build Install Images (default: latest)"
        required: false
        default: "latest"
        type: string
      release_tag:
        description: "Release tag to create/update (example: install-user-v2026.04.27)"
        required: true
        type: string
      release_name:
        description: "Release name (defaults to tag if empty)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create as draft release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish release assets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List recent Build Install Images runs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Recent completed Build Install Images runs ==="
          echo ""
          gh run list \
            --workflow=build-images.yml \
            --status=completed \
            --limit=10 \
            --json=number,createdAt,status,conclusion \
            --template='{{range .}}{{.number}} | {{.createdAt}} | {{.status}} | {{.conclusion}}{{"\n"}}{{end}}'
          echo ""
          echo "Optionally override by setting source_run_id to a specific run number."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve source run ID
        id: run-id
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="${{ inputs.source_run_id }}"

          if [[ "$source_run_id" == "latest" ]]; then
            # Resolve to the databaseId of the most recent completed run
            db_id=$(gh run list \
              --workflow=build-images.yml \
              --status=completed \
              --limit=1 \
              --json=databaseId,number \
              --jq='.[0].databaseId')
            run_num=$(gh run list \
              --workflow=build-images.yml \
              --status=completed \
              --limit=1 \
              --json=databaseId,number \
              --jq='.[0].number')
            echo "Resolved 'latest' to run number $run_num (database ID: $db_id)"
            source_run_id="$db_id"
          else
            # User supplied a run number — resolve it to the internal database ID
            db_id=$(gh run list \
              --workflow=build-images.yml \
              --limit=50 \
              --json=databaseId,number \
              --jq="map(select(.number == ($source_run_id | tonumber))) | .[0].databaseId")
            [[ -n "$db_id" && "$db_id" != "null" ]] || {
              echo "Could not resolve run number $source_run_id to a database ID" >&2
              exit 1
            }
            echo "Resolved run number $source_run_id to database ID: $db_id"
            source_run_id="$db_id"
          fi

          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag }}"
          release_name="${{ inputs.release_name }}"

          if [[ -z "$release_name" ]]; then
            release_name="$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-iso-*
          merge-multiple: true
          path: release-assets

      - name: Download IMG artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-img-*
          merge-multiple: true
          path: release-assets

      - name: Download minimal IMG artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-minimal-img-*
          merge-multiple: true
          path: release-assets

      - name: Download checksums artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-checksums-*
          merge-multiple: true
          path: release-assets

      - name: Validate downloaded release assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            release-assets/install-user.iso
            release-assets/install-user.img
            release-assets/install-user-minimal.img
            release-assets/checksums.sha256
          )

          for file in "${required_files[@]}"; do
            [[ -s "$file" ]] || { echo "Missing required file: $file" >&2; exit 1; }
          done

          echo "Release assets ready:"
          ls -lh release-assets

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: true
          files: |
            release-assets/install-user.iso
            release-assets/install-user.img
            release-assets/install-user-minimal.img
            release-assets/checksums.sha256
          generate_release_notes: true
