name: Publish Online Install Release

on:
  workflow_call:
    inputs:
      source_run_id:
        description: "Run database ID containing exact-release build artifacts"
        required: true
        type: string
      release_tag:
        description: "Existing Release Please tag"
        required: true
        type: string
      release_sha:
        description: "Exact Release Please source SHA"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Build Install Images run database ID"
        required: true
        type: string
      release_tag:
        description: "Existing Release Please tag (example: Installer-7.4.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish online release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and verify release provenance
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^Installer-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use Installer-<SemVer>: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq='.object.sha')"
          if [[ -n "$EXPECTED_RELEASE_SHA" && "$tag_sha" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Release tag points to $tag_sha, expected $EXPECTED_RELEASE_SHA" >&2
            exit 1
          fi

          source_sha="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq='.headSha')"
          if [[ "$source_sha" != "$tag_sha" ]]; then
            echo "Source run built $source_sha, but $RELEASE_TAG points to $tag_sha" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SOURCE_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            conclusion="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq='.conclusion')"
            [[ "$conclusion" == "success" ]] || {
              echo "Manual publication requires a successful source run: $conclusion" >&2
              exit 1
            }
          fi

          release_version="${RELEASE_TAG#Installer-}"
          {
            echo "release_sha=$tag_sha"
            echo "release_version=$release_version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact released source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git describe --tags --exact-match "$RELEASE_SHA")" = "$RELEASE_TAG"

      - name: Download exact-release ISO
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-iso-*
          merge-multiple: true
          path: release-assets

      - name: Download exact-release online image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-minimal-img-*
          merge-multiple: true
          path: release-assets

      - name: Download exact-release Rescue launcher
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-linux-rescue-launcher-*
          merge-multiple: true
          path: release-assets

      - name: Validate downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            release-assets/install-user.iso \
            release-assets/install-user-minimal.img \
            release-assets/linux-rescue-vm.sh; do
            [[ -s "$file" ]] || { echo "Missing required file: $file" >&2; exit 1; }
          done

      - name: Prepare versioned online release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail

          iso_asset="unraid-installer-${RELEASE_VERSION}-online.iso"
          img_asset="unraid-installer-${RELEASE_VERSION}-online.img.zip"
          launcher_asset="unraid-installer-linux-rescue.sh"

          mv release-assets/install-user.iso "release-assets/${iso_asset}"
          mv release-assets/linux-rescue-vm.sh "release-assets/${launcher_asset}"
          sed -i "s/^PUBLISHED_RELEASE_TAG=\"\"$/PUBLISHED_RELEASE_TAG=\"${RELEASE_TAG}\"/" \
            "release-assets/${launcher_asset}"
          grep -qx "PUBLISHED_RELEASE_TAG=\"${RELEASE_TAG}\"" "release-assets/${launcher_asset}"
          chmod 0755 "release-assets/${launcher_asset}"

          zip -9 -j "release-assets/${img_asset}" release-assets/install-user-minimal.img
          rm -f release-assets/install-user-minimal.img

      - name: Generate per-file checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for asset in \
            release-assets/unraid-installer-*.iso \
            release-assets/unraid-installer-*.img.zip \
            release-assets/unraid-installer-linux-rescue.sh; do
            md5sum "$asset" | awk '{print $1}' > "${asset}.md5"
            sha256sum "$asset" | awk '{print $1}' > "${asset}.sha256"
          done

      - name: Attach assets to the existing Release Please release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            release-assets/unraid-installer-*.iso \
            release-assets/unraid-installer-*.img.zip \
            release-assets/unraid-installer-*.iso.md5 \
            release-assets/unraid-installer-*.img.zip.md5 \
            release-assets/unraid-installer-linux-rescue.sh \
            release-assets/unraid-installer-linux-rescue.sh.md5 \
            release-assets/unraid-installer-*.sha256 \
            --clobber

      - name: Verify anonymous release downloads
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          downloaded="$(mktemp -d)"
          trap 'rm -rf "$downloaded"' EXIT
          for asset in release-assets/*; do
            filename="${asset##*/}"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --output "$downloaded/$filename" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$filename"
            cmp "$asset" "$downloaded/$filename"
          done

      - name: Update release download options
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          ./scripts/update-release-download-options.sh \
            --release-tag "$RELEASE_TAG" \
            --release-version "$RELEASE_VERSION"

      - name: Remove bundled images from older stable releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq='.tag_name')"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "$RELEASE_TAG is not the latest stable release; skipping old bundled-image cleanup."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ "$tag" == Installer-* && "$tag" != "$RELEASE_TAG" ]] || continue
            while IFS= read -r asset; do
              case "$asset" in
                install-user.img.zip|install-user.img.zip.md5|install-user.img.zip.sha256|unraid-installer-*-bundled.img.zip|unraid-installer-*-bundled.img.zip.md5|unraid-installer-*-bundled.img.zip.sha256)
                  gh release delete-asset "$tag" "$asset" --yes
                  ;;
              esac
            done < <(gh release view "$tag" --json assets --jq='.assets[].name')
          done < <(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq='.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')
