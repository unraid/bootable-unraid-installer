name: Publish Online Install Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID from Build Install Images (default: latest)"
        required: false
        default: "latest"
        type: string
      release_tag:
        description: "Release tag to create/update (example: Installer-7.3.0)"
        required: true
        type: string
      release_name:
        description: "Release name (defaults to tag if empty)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create as draft release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish online release assets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # actions/checkout v4, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/actions/checkout.git refs/tags/v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: List recent Build Install Images runs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Recent completed Build Install Images runs ==="
          echo ""
          gh run list \
            --workflow=build-images.yml \
            --status=completed \
            --limit=10 \
            --json=number,createdAt,status,conclusion \
            --template='{{range .}}{{.number}} | {{.createdAt}} | {{.status}} | {{.conclusion}}{{"\n"}}{{end}}'
          echo ""
          echo "Optionally override by setting source_run_id to a specific run number."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve source run ID
        id: run-id
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="${{ inputs.source_run_id }}"

          if [[ "$source_run_id" == "latest" ]]; then
            # Resolve to the databaseId of the most recent completed run
            db_id=$(gh run list \
              --workflow=build-images.yml \
              --status=completed \
              --limit=1 \
              --json=databaseId,number \
              --jq='.[0].databaseId')
            run_num=$(gh run list \
              --workflow=build-images.yml \
              --status=completed \
              --limit=1 \
              --json=databaseId,number \
              --jq='.[0].number')
            echo "Resolved 'latest' to run number $run_num (database ID: $db_id)"
            source_run_id="$db_id"
          else
            # User supplied a run number — resolve it to the internal database ID
            db_id=$(gh run list \
              --workflow=build-images.yml \
              --limit=50 \
              --json=databaseId,number \
              --jq="map(select(.number == ($source_run_id | tonumber))) | .[0].databaseId")
            [[ -n "$db_id" && "$db_id" != "null" ]] || {
              echo "Could not resolve run number $source_run_id to a database ID" >&2
              exit 1
            }
            echo "Resolved run number $source_run_id to database ID: $db_id"
            source_run_id="$db_id"
          fi

          source_head_sha="$(gh run view "$source_run_id" --json headSha --jq='.headSha')"
          source_conclusion="$(gh run view "$source_run_id" --json conclusion --jq='.conclusion')"
          [[ "$source_head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source run did not provide a valid head SHA: $source_head_sha" >&2
            exit 1
          }
          [[ "$source_conclusion" == "success" ]] || {
            echo "Source run must have succeeded before release: $source_conclusion" >&2
            exit 1
          }

          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag }}"
          release_name="${{ inputs.release_name }}"

          if [[ -z "$release_name" ]]; then
            release_name="$release_tag"
          fi

          release_version="${release_tag#Installer-}"
          if [[ ! "$release_tag" =~ ^Installer-[[:alnum:]._-]+$ ]]; then
            echo "Error: release tag must match Installer-<version>: '$release_tag'" >&2
            exit 1
          fi
          release_version="$(tr -cs '[:alnum:]._' '-' <<< "$release_version" | sed 's/^-//; s/-$//')"
          if [[ -z "$release_version" ]]; then
            echo "Error: sanitized release version is empty for release tag '$release_tag'" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact from source run
        # actions/download-artifact v4, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/actions/download-artifact.git refs/tags/v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-iso-*
          merge-multiple: true
          path: release-assets

      - name: Download online IMG artifact from source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-minimal-img-*
          merge-multiple: true
          path: release-assets

      - name: Download Linux Rescue launcher from source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run-id.outputs.run_id }}
          pattern: install-user-linux-rescue-launcher-*
          merge-multiple: true
          path: release-assets

      - name: Validate downloaded release assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            release-assets/install-user.iso
            release-assets/install-user-minimal.img
            release-assets/linux-rescue-vm.sh
          )

          for file in "${required_files[@]}"; do
            [[ -s "$file" ]] || { echo "Missing required file: $file" >&2; exit 1; }
          done

          echo "Release assets ready:"
          ls -lh release-assets

      - name: Prepare versioned online release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
        run: |
          set -euo pipefail

          iso_asset="unraid-installer-${RELEASE_VERSION}-online.iso"
          img_asset="unraid-installer-${RELEASE_VERSION}-online.img.zip"
          launcher_asset="unraid-installer-linux-rescue.sh"

          mv release-assets/install-user.iso "release-assets/${iso_asset}"
          mv release-assets/linux-rescue-vm.sh "release-assets/${launcher_asset}"
          sed -i \
            's/^PUBLISHED_RELEASE_TAG=""$/PUBLISHED_RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"/' \
            "release-assets/${launcher_asset}"
          if ! grep -qx 'PUBLISHED_RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"' \
            "release-assets/${launcher_asset}"; then
            echo "Failed to pin the Linux Rescue launcher to the release tag." >&2
            exit 1
          fi
          chmod 0755 "release-assets/${launcher_asset}"

          echo "Compressing online installer image as ${img_asset}..."
          zip -9 -j "release-assets/${img_asset}" release-assets/install-user-minimal.img
          rm -f release-assets/install-user-minimal.img

          echo "Compressed sizes:"
          ls -lh "release-assets/${iso_asset}" "release-assets/${img_asset}" \
            "release-assets/${launcher_asset}"

      - name: Generate per-file checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for asset in \
            release-assets/unraid-installer-*.iso \
            release-assets/unraid-installer-*.img.zip \
            release-assets/unraid-installer-linux-rescue.sh; do
            md5sum "$asset" | awk '{print $1}' > "${asset}.md5"
            sha256sum "$asset" | awk '{print $1}' > "${asset}.sha256"
          done

          ls -lh release-assets/*.md5 release-assets/*.sha256

      - name: Create or update GitHub release
        # softprops/action-gh-release v2, pinned to the tag target. Refresh with:
        # git ls-remote https://github.com/softprops/action-gh-release.git refs/tags/v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ steps.run-id.outputs.source_head_sha }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: true
          files: |
            release-assets/unraid-installer-*.iso
            release-assets/unraid-installer-*.img.zip
            release-assets/unraid-installer-*.iso.md5
            release-assets/unraid-installer-*.img.zip.md5
            release-assets/unraid-installer-linux-rescue.sh
            release-assets/unraid-installer-linux-rescue.sh.md5
            release-assets/unraid-installer-*.sha256
          generate_release_notes: false

      - name: Update release download options
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
        run: |
          set -euo pipefail
          ./scripts/update-release-download-options.sh \
            --release-tag "$RELEASE_TAG" \
            --release-version "$RELEASE_VERSION"
