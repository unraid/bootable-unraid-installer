name: Publish Install Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID from Build Install Images"
        required: true
        type: string
      release_tag:
        description: "Release tag to create/update (example: install-user-v2026.04.27)"
        required: true
        type: string
      release_name:
        description: "Release name (defaults to tag if empty)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create as draft release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish release assets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List recent Build Install Images runs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Recent completed Build Install Images runs ==="
          echo ""
          gh run list \
            --workflow=build-images.yml \
            --status=completed \
            --limit=10 \
            --json=number,createdAt,status,conclusion \
            --template='{{range .}}{{.number}} | {{.createdAt}} | {{.status}} | {{.conclusion}}{{"\n"}}{{end}}'
          echo ""
          echo "Use the run number (first column) as source_run_id input above."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag }}"
          release_name="${{ inputs.release_name }}"

          if [[ -z "$release_name" ]]; then
            release_name="$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-iso-*
          merge-multiple: true
          path: release-assets

      - name: Download IMG artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-img-*
          merge-multiple: true
          path: release-assets

      - name: Download minimal IMG artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-minimal-img-*
          merge-multiple: true
          path: release-assets

      - name: Download checksums artifact from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: install-user-checksums-*
          merge-multiple: true
          path: release-assets

      - name: Validate downloaded release assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            release-assets/install-user.iso
            release-assets/install-user.img
            release-assets/install-user-minimal.img
            release-assets/checksums.sha256
          )

          for file in "${required_files[@]}"; do
            [[ -s "$file" ]] || { echo "Missing required file: $file" >&2; exit 1; }
          done

          echo "Release assets ready:"
          ls -lh release-assets

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: true
          files: |
            release-assets/install-user.iso
            release-assets/install-user.img
            release-assets/install-user-minimal.img
            release-assets/checksums.sha256
          generate_release_notes: true
